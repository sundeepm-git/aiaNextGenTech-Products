Agent job:
1. Read Microsoft Defender for Cloud alerts.
2. Extract resourceId, issueType, severity, and alertId.
3. Output a clean JSON object with these fields.
4. Do not fix anything. Only classify and extract.
5. Use azure cli or azure grap api to access the security alerts in Microsoft Defender for Cloud.
5. Ensure the output is structured and easy to parse for further analysis by the other agents in the workflow.

